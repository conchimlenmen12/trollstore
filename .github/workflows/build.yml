name: Build TrollStore

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-trollstore:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos
        run: |
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          export THEOS="$HOME/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Fetch iPhoneOS16.5 SDK
        run: |
          mkdir -p "$THEOS/sdks"
          git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks "$THEOS/sdks-tmp"
          cd "$THEOS/sdks-tmp"
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv iPhoneOS16.5.sdk "$THEOS/sdks/"
          cd ..
          rm -rf "$THEOS/sdks-tmp"

      - name: Install build dependencies
        run: |
          brew install ldid libarchive make
          echo "/opt/homebrew/opt/make/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Build and install pwnify
        run: |
          make -C Pwnify install

      - name: Build TrollStore
        run: |
          export THEOS="$HOME/theos"
          make

      - name: Upload TrollStore.tar for TrollInstallerX
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-tar
          path: _build/TrollStore.tar

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-build
          path: |
            _build/TrollStore.tar
            TrollStoreLite/packages/*.deb

  build-trollinstallerx:
    needs: build-trollstore
    runs-on: macos-latest
    defaults:
      run:
        working-directory: TrollInstallerX
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download freshly built TrollStore.tar
        uses: actions/download-artifact@v4
        with:
          name: TrollStore-tar
          path: TrollInstallerX/TrollInstallerX/Resources

      - name: Install ldid
        run: brew install ldid

      - name: Build IPA
        run: |
          xcodebuild -configuration Release -derivedDataPath DerivedData/TrollInstallerX -destination 'generic/platform=iOS' -scheme TrollInstallerX CODE_SIGNING_ALLOWED="NO" CODE_SIGNING_REQUIRED="NO" CODE_SIGN_IDENTITY=""
          cp Resources/ents.plist DerivedData/TrollInstallerX/Build/Products/Release-iphoneos/
          cd DerivedData/TrollInstallerX/Build/Products/Release-iphoneos
          mkdir Payload
          cp -r TrollInstallerX.app Payload
          ldid -Sents.plist Payload/TrollInstallerX.app
          zip -qry TrollInstallerX.ipa Payload
          cp TrollInstallerX.ipa "$GITHUB_WORKSPACE/TrollInstallerX/"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollInstallerX-ipa
          path: TrollInstallerX/TrollInstallerX.ipa
